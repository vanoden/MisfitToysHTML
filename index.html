<html>
<head>
	<title>Misfit Toys</title>
	<!-- Load Fonts from Google -->
	<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans&family=Permanent+Marker&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="/css/home.css">
</head>
<body>
	<!-- Outer Container -->
	<div id="outer-container">
		<!-- Header -->
		<header>
			<!-- Mini Logo -->
			<img id="header-logo" src="/img/HeaderIcon.png" alt="Mini Logo">
			<!-- Top HorizontalNavigation -->
			<nav id="mainNav" class="nav-menu nav-menu--horizontal">
				<r7 object="navigation" property="menu" code="topnav" version="v2"/>
			</nav>
		</header>
		<!-- Find black border under header -->
		<div class="header-bottom-border"></div>
		<!-- Banner -->
		<div id="banner" class="banner">
			<img id="banner-photo" src="/img/BannerPhoto.png" alt="Banner Image">
			<img id="banner-logo" src="/img/BannerLogo.png" alt="Banner Logo">
		</div>
		<div id="bottom-section">
		</div>
		<!-- Content Section of the page -->
		<div id="content-section">
			<h2><r7 object="page" property="title"/></h2>
			<r7 object="page" property="view"/>
		</div>
	</div>
	<!-- End of Outer Container -->
</body>
</html>
